name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build
        run: swift build -c release --arch arm64
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="loupe-${version}-macos-arm64.tar.gz"
          mkdir -p dist
          cp "$(swift build -c release --arch arm64 --show-bin-path)/loupe" dist/
          cp LICENSE README.md dist/
          tar -czf "$archive" -C dist .
          shasum -a 256 "$archive" > "$archive.sha256"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="## ${GITHUB_REF_NAME#v}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" --title "$GITHUB_REF_NAME" --notes "$notes"
